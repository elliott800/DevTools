<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Starter (no build)</title>
<style>
  :root{--bg:#f5f0e6;--surface:#fbf8f1;--ink:#211d18;--muted:#6d655a;--accent:#c0553d;--line:rgba(33,29,24,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.55;max-width:640px;margin:0 auto;padding:2.5rem 1.25rem}
  h1{font-size:2rem}.sub{color:var(--muted);margin-bottom:2rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:.5rem 1rem;font-weight:600;background:var(--ink);color:var(--bg)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  input{font:inherit;padding:.6rem .8rem;border:1px solid var(--line);border-radius:9px;background:#fff;flex:1}
  .row{display:flex;gap:.6rem;align-items:center}
  .big{font-size:2.5rem;font-weight:800;color:var(--accent);text-align:center;margin:.5rem 0}
  ul{list-style:none;margin-top:1rem}
  li{display:flex;gap:.6rem;padding:.5rem .2rem;border-bottom:1px solid var(--line);align-items:center}
  li.done label{text-decoration:line-through;color:var(--muted)}
  li .x{margin-left:auto;color:var(--accent);cursor:pointer;font-weight:700;opacity:.6}
  li .x:hover{opacity:1}
  .muted{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
  <h1>React Starter</h1>
  <p class="sub">React 18 + ReactDOM + Babel — all local, no npm, no bundler. JSX is compiled in the
     browser via <code>&lt;script type="text/babel"&gt;</code>. Great for prototyping; use a real build for production.</p>
  <div id="root"></div>

<!-- Local React runtime + in-browser JSX compiler -->
<script src="../vendor/react/react.production.min.js"></script>
<script src="../vendor/react/react-dom.production.min.js"></script>
<script src="../vendor/react/babel.min.js"></script>

<script type="text/babel">
const { useState } = React;

function Counter() {
  const [n, setN] = useState(0);
  return (
    <div className="card">
      <h2>Counter</h2>
      <div className="big">{n}</div>
      <div className="row" style={{ justifyContent: 'center' }}>
        <button className="ghost" onClick={() => setN(n - 1)}>−</button>
        <button onClick={() => setN(n + 1)}>+</button>
        <button className="ghost" onClick={() => setN(0)}>reset</button>
      </div>
    </div>
  );
}

function Todos() {
  const [items, setItems] = useState([
    { id: 1, text: 'Learn hooks', done: true },
    { id: 2, text: 'Build a component', done: false },
  ]);
  const [text, setText] = useState('');

  const add = () => {
    if (!text.trim()) return;
    setItems([...items, { id: Date.now(), text, done: false }]);
    setText('');
  };
  const toggle = id => setItems(items.map(i => i.id === id ? { ...i, done: !i.done } : i));
  const remove = id => setItems(items.filter(i => i.id !== id));

  return (
    <div className="card">
      <h2>To-do</h2>
      <div className="row">
        <input value={text} placeholder="Add a task…"
               onChange={e => setText(e.target.value)}
               onKeyDown={e => e.key === 'Enter' && add()} />
        <button onClick={add}>Add</button>
      </div>
      <ul>
        {items.map(i => (
          <li key={i.id} className={i.done ? 'done' : ''}>
            <input type="checkbox" checked={i.done} onChange={() => toggle(i.id)} />
            <label>{i.text}</label>
            <span className="x" onClick={() => remove(i.id)}>✕</span>
          </li>
        ))}
      </ul>
      <p className="muted">{items.filter(i => !i.done).length} remaining</p>
    </div>
  );
}

function App() {
  return <><Counter /><Todos /></>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
